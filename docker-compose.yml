services:
  trainify-pg:
    image: bitnami/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=trainify
    volumes:
      - trainify-pg-data:/bitnami/postgresql

  trainify-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - trainify-pg
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DATABASE_URL=postgresql://docker:docker@trainify-pg:5432/trainify?schema=public

volumes:
  trainify-pg-data:
